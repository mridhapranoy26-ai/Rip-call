name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange files
        run: |
          mkdir -p lib tool server
          mv main.dart lib/
          mv patch_android.py tool/
          mv server.js package.json server/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android scaffold
        run: |
          flutter create --platforms=android --org com.ipcalling --project-name ip_calling /tmp/scaffold
          cp -r /tmp/scaffold/android ./android
          python3 tool/patch_android.py
      - run: flutter pub get
      - run: flutter analyze || true
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ip-calling-apk
          path: build/app/outputs/flutter-apk/app-release.apk
